name: AI Bug Hunter

on:
  workflow_dispatch:
  # Other repos can ping this with `gh api repos/allimist/allimist/dispatches -f event_type=refresh`
  repository_dispatch:
    types: [refresh]
  schedule:
    # Hourly, so new contributions show up within about an hour instead of the next day.
    - cron: "7 * * * *"
  push:
    branches:
      - main
    paths:
      - "ai-bug-hunter/**"
      - ".github/workflows/ai-bug-hunter.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate AI Bug Hunter SVGs
        working-directory: ai-bug-hunter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          # Must match the timezone your GitHub profile graph is viewed in, or totals drift from the profile.
          TIMEZONE: Asia/Jerusalem
          OUT_DIR: ../dist
        run: npm run generate

      - name: Publish to output branch
        # force_orphan keeps the output branch at a single commit, so hourly runs never bloat history.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          commit_message: "Update AI Bug Hunter animation"
